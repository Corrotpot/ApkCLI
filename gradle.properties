# JVM: the agent engine + Rust build run alongside Gradle, so keep the daemon
# roomy but not greedy.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Built-in Kotlin (AGP 9 default) is used, so `org.jetbrains.kotlin.android` is
# NOT applied anywhere. Applying it is a hard error: it needs the legacy
# `BaseExtension`, which `android.newDsl=true` — also an AGP 9 default — no
# longer exposes.
#
# AGP pins the Kotlin Gradle plugin to 2.2.10 under built-in Kotlin. The root
# build file raises it to the version in the catalog through a buildscript
# classpath entry, which is the documented way to go higher.

kotlin.code.style=official
kotlin.incremental=true

# --- ApkCLI native build switches -------------------------------------------
# Rust ABIs to build, and therefore also the APK's abiFilters.
#   arm64-v8a  every real device from 2019 on
#   x86_64     emulators
# armeabi-v7a builds and is supported (see the pointer-width split around
# RTLD_NEXT in execshim), but is not shipped by default. Add it here if you
# need 32-bit devices; it costs ~5 MB of APK.
apkcli.abis=arm64-v8a,x86_64
# Set to false to skip the cargo step entirely (useful for UI-only iteration;
# the app then runs with the native core disabled and degrades to the
# Kotlin fallbacks).
apkcli.buildRust=true
# cargo profile for the native core
apkcli.rustProfile=release
