#
# Version catalog for ApkCLI.
#
# Pins were researched in October 2026. If an artifact fails to resolve, see
# docs/TOOLCHAIN.md — it lists where each number comes from and how to bump it.
#
# Hard constraint worth remembering: the Compose core line is tied to compileSdk.
#   Compose 1.11.x -> compileSdk 36 (what we use)
#   Compose 1.12.x -> compileSdk 37 + AGP 9.1.2
# Do not bump `compose` past 1.11.x without also bumping compileSdk.
#
[versions]
agp = "9.1.1"
kotlin = "2.3.20"

compileSdk = "36"
minSdk = "26"
targetSdkPlay = "36"
targetSdkPower = "28"

# Pinned to AGP 9.1.1's own default NDK, so AGP's stripping tasks and the
# cargo-ndk cross-compile use the same toolchain. r28 also emits 16 KB-aligned
# segments by default, which Android 15+ devices with 16 KB pages require.
ndk = "28.2.13676358"

# androidx
androidxCore = "1.16.0"
androidxActivity = "1.10.1"
androidxLifecycle = "2.9.0"
androidxDatastore = "1.1.1"
androidxDocumentFile = "1.1.0"
androidxAnnotation = "1.9.1"

# compose (explicit pins instead of the BOM — see note above)
compose = "1.11.4"
composeMaterial3 = "1.4.0"
# No material-icons-*: every icon is a VS Code codicon (ui/icons/Codicons.kt).

# networking / serialization / async
okhttp = "5.1.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.6.2"

# code editor widget
sora = "0.23.6"

# .xz decompression for Termux packages (data.tar.xz). 0BSD. The base classes
# are Java 8 bytecode; the META-INF/versions/9 overrides are ignored by D8.
xz = "1.12"

# JVM unit tests (core/src/test). 4.13.2 is JUnit 4's final release, and what
# AGP's unit-test runner expects without extra engines.
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# collectAsStateWithLifecycle: stops flow collection when the screen is not
# visible, which matters because a streaming turn keeps producing events.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentFile" }

compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

sora-bom = { group = "io.github.Rosemoe.sora-editor", name = "bom", version.ref = "sora" }
sora-editor = { group = "io.github.Rosemoe.sora-editor", name = "editor" }
sora-language-textmate = { group = "io.github.Rosemoe.sora-editor", name = "language-textmate" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android alias: AGP 9 provides Kotlin itself ("built-in Kotlin") and
# rejects org.jetbrains.kotlin.android. The compiler version comes from the
# `kotlin` version above, applied as a buildscript classpath in the root build
# file. See docs/TOOLCHAIN.md.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
